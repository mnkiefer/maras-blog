<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="700" viewBox="0 0 1440 700" role="img" aria-labelledby="title desc">
  <title id="title">Operational-value evidence overview</title>
  <desc id="desc">Three stages move from a frozen repository-native metric, to explicit acceptance evidence, to immutable before-and-after measurement.</desc>
  <defs>
    <style>
      .title{font:500 38px Georgia,serif;fill:#202d36}.sub{font:16px Arial,sans-serif;fill:#5d6b70}.stage{font:700 14px Arial,sans-serif;letter-spacing:1.5px;fill:#386d9e}.head{font:500 27px Georgia,serif;fill:#202d36}.label{font:700 15px Arial,sans-serif;fill:#202d36}.body{font:15px Arial,sans-serif;fill:#5d6b70}.value{font:700 27px Arial,sans-serif;fill:#386d9e}.foot{font:600 17px Arial,sans-serif;fill:#202d36}
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0L12 6L0 12Z" fill="#749db7"/>
    </marker>
  </defs>
  <rect width="1440" height="700" rx="22" fill="#fbfaf7"/>
  <text class="title" x="60" y="68">From workflow activity to a bounded value claim</text>
  <text class="sub" x="60" y="101">Each boundary requires different evidence. Later stages cannot be inferred from earlier ones.</text>

  <g transform="translate(60 145)">
    <rect width="390" height="395" rx="18" fill="#fff" stroke="#d9dedf" stroke-width="2"/>
    <rect x="24" y="24" width="96" height="30" rx="15" fill="#e8f0f5"/>
    <text class="stage" x="72" y="45" text-anchor="middle">STAGE 1</text>
    <text class="head" x="24" y="92">Freeze the function</text>
    <rect x="24" y="120" width="342" height="64" rx="10" fill="#f3f5f4"/>
    <text class="label" x="42" y="146">Natural-language intent</text>
    <text class="body" x="42" y="169">Reduce oversized production Go files</text>
    <path d="M195 194V218" stroke="#749db7" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="24" y="225" width="342" height="72" rx="10" fill="#e8f0f5" stroke="#b9cedb"/>
    <text class="label" x="42" y="252">Repository-native metric</text>
    <text class="body" x="42" y="276">Non-test .go files under pkg/ at 800+ lines</text>
    <path d="M195 307V331" stroke="#749db7" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="24" y="338" width="342" height="38" rx="10" fill="#fff8f3" stroke="#d9987b"/>
    <text class="label" x="42" y="363">Immutable baseline</text>
    <text class="value" x="342" y="365" text-anchor="end">2 files</text>
  </g>

  <path d="M466 343H486" stroke="#749db7" stroke-width="3" marker-end="url(#arrow)"/>

  <g transform="translate(520 145)">
    <rect width="390" height="395" rx="18" fill="#fff" stroke="#d9dedf" stroke-width="2"/>
    <rect x="24" y="24" width="96" height="30" rx="15" fill="#e8f0f5"/>
    <text class="stage" x="72" y="45" text-anchor="middle">STAGE 2</text>
    <text class="head" x="24" y="92">Prove acceptance</text>
    <rect x="24" y="120" width="342" height="66" rx="10" fill="#f3f5f4"/>
    <text class="label" x="42" y="147">Retained safe outputs</text>
    <text class="value" x="342" y="158" text-anchor="end">3</text>
    <path d="M195 196V220" stroke="#749db7" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="24" y="227" width="342" height="70" rx="10" fill="#fff8f3" stroke="#d9987b"/>
    <text class="label" x="42" y="254">Acceptance rule</text>
    <text class="body" x="42" y="278">Explicit output-to-implementation lineage only</text>
    <path d="M195 307V331" stroke="#749db7" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="24" y="338" width="342" height="38" rx="10" fill="#e8f0f5" stroke="#b9cedb"/>
    <text class="label" x="42" y="363">Accepted implementation</text>
    <text class="value" x="342" y="365" text-anchor="end">1</text>
  </g>

  <path d="M926 343H946" stroke="#749db7" stroke-width="3" marker-end="url(#arrow)"/>

  <g transform="translate(980 145)">
    <rect width="400" height="395" rx="18" fill="#fff" stroke="#d9dedf" stroke-width="2"/>
    <rect x="24" y="24" width="96" height="30" rx="15" fill="#e8f0f5"/>
    <text class="stage" x="72" y="45" text-anchor="middle">STAGE 3</text>
    <text class="head" x="24" y="92">Measure before / after</text>
    <text class="label" x="24" y="138">Actual first parent</text>
    <rect x="24" y="151" width="300" height="28" rx="6" fill="#d9dedf"/>
    <text class="value" x="366" y="176" text-anchor="end">2</text>
    <text class="label" x="24" y="224">Accepted merge commit</text>
    <rect x="24" y="237" width="150" height="28" rx="6" fill="#749db7"/>
    <text class="value" x="366" y="262" text-anchor="end">1</text>
    <line x1="24" y1="300" x2="376" y2="300" stroke="#d9dedf" stroke-width="2"/>
    <rect x="24" y="324" width="352" height="52" rx="10" fill="#fff8f3" stroke="#d9987b"/>
    <text class="label" x="42" y="356">Direction-aware result</text>
    <text class="value" x="354" y="359" text-anchor="end">+1 fewer</text>
  </g>

  <rect x="60" y="580" width="1320" height="72" rx="14" fill="#e8f0f5" stroke="#b9cedb"/>
  <text class="foot" x="720" y="624" text-anchor="middle">Output production is not acceptance, and acceptance is not a measured repository outcome.</text>
</svg>
